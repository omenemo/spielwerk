<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spielwerk — small design tools</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; display: flex; min-height: 100vh; background: #e9e7e2; }
  #panel { width: 260px; padding: 18px; background: #fff; border-right: 1px solid #ddd;
           box-sizing: border-box; flex-shrink: 0; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #intro { color: #444; margin: 0 0 16px; }
  #panel select { width: 100%; padding: 6px; border-radius: 8px; border: 1px solid #ccc;
                  background: #fff; font: inherit; }
  #panel label { display: block; color: #444; margin-bottom: 4px; }
  #desc { color: #999; margin-top: 10px; }
  #stage { flex: 1; display: flex; }
  #stage iframe { flex: 1; border: none; }
</style>
<body>
<div id="panel">
  <h1>spielwerk</h1>
  <p id="intro">A collection of small parametric design tools.
    Each tool is a single self-contained page: sliders on the left,
    live vector preview on the right, SVG and PNG export built in.
    Pick one below — everything runs in your browser.</p>
  <label for="pick">tool</label>
  <select id="pick"></select>
  <p id="desc"></p>
</div>
<div id="stage"><iframe id="frame" title="tool"></iframe></div>
<script>
  fetch("tools.json").then(r => r.json()).then(tools => {
    const pick = document.getElementById("pick");
    for (const t of tools) pick.append(new Option(t.name, t.file));
    const load = () => {
      const t = tools[pick.selectedIndex];
      document.getElementById("frame").src = t.file;
      document.getElementById("desc").textContent = t.desc;
    };
    pick.addEventListener("input", load);
    load();
  });
</script>
</body>
</html>
