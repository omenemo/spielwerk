<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spielwerk — small design tools</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #bar { position: fixed; left: 16px; top: 16px; z-index: 2; display: flex; align-items: center;
         gap: 10px; padding: 8px 14px; background: #fff; border-radius: 8px;
         box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  h1 { font-size: 14px; margin: 0; }
  #bar label { color: #444; margin-left: 6px; }
  #bar select { padding: 3px 6px; border-radius: 6px; border: 1px solid #ccc;
                background: #fff; font: inherit; }
  #stage { flex: 1; display: flex; position: relative; }
  #stage iframe { flex: 1; border: none; }
  #about { position: absolute; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: #fff;
           border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.25); overflow: hidden; }
  #about header { display: flex; align-items: center; justify-content: space-between;
                  padding: 8px 12px; background: #1c1c1c; color: #f4f1ea; cursor: grab;
                  user-select: none; touch-action: none; }
  #about header:active { cursor: grabbing; }
  #about header button { border: none; background: none; color: #f4f1ea; font-size: 14px;
                         cursor: pointer; padding: 0 2px; }
  #about .body { padding: 12px 14px; }
  #about .body p { margin: 0 0 10px; color: #444; }
  #about .body p:last-child { margin: 0; color: #999; }
</style>
<body>
<div id="bar">
  <h1>spielwerk</h1>
  <label for="pick">tool</label>
  <select id="pick"></select>
</div>
<div id="stage">
  <iframe id="frame" title="tool"></iframe>
  <div id="about">
    <header id="grab"><span>spielwerk</span><button id="close" aria-label="close">✕</button></header>
    <div class="body">
      <p>A collection of small parametric design tools. Each tool is a single
         self-contained page: sliders on the left, live vector preview on the
         right, SVG and PNG export built in. Everything runs in your browser.</p>
      <p id="desc"></p>
    </div>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);

  // tool manifest — add a line per tool
  const tools = [
    { file: "tools/arrow-poster.html", name: "Arrow Poster",
      desc: "Parametric arrow compositions on a portrait artboard. Grid placement, stacked contours, SVG/PNG export." }
  ];

  for (const t of tools) $("pick").append(new Option(t.name, t.file));
  const load = () => {
    const t = tools[$("pick").selectedIndex];
    $("frame").src = t.file;
    $("desc").textContent = t.desc;
  };
  $("pick").addEventListener("input", () => { load(); $("about").style.display = "none"; });
  load();

  $("close").addEventListener("click", () => $("about").style.display = "none");

  // drag via pointer capture — keeps events even over the iframe
  $("grab").addEventListener("pointerdown", e => {
    if (e.target.tagName === "BUTTON") return;
    const box = $("about"), r = box.getBoundingClientRect(), s = $("stage").getBoundingClientRect();
    box.style.transform = "none";                      // convert centered pos to px before dragging
    box.style.left = (r.left - s.left) + "px";
    box.style.top = (r.top - s.top) + "px";
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    const move = ev => {
      box.style.left = Math.max(0, Math.min(ev.clientX - s.left - dx, s.width - r.width)) + "px";
      box.style.top  = Math.max(0, Math.min(ev.clientY - s.top - dy, s.height - 36)) + "px";
    };
    $("grab").setPointerCapture(e.pointerId);
    $("grab").addEventListener("pointermove", move);
    $("grab").addEventListener("pointerup", () => $("grab").removeEventListener("pointermove", move), {once: true});
  });
</script>
</body>
</html>
