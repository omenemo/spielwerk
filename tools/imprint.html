<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Imprint — embossed burst generator</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #panel { width: 264px; margin: 16px; padding: 14px 18px; background: #fff; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; flex-shrink: 0;
           align-self: flex-start; max-height: calc(100vh - 32px); overflow-y: auto; }
  #panel label { display: grid; grid-template-columns: 90px 1fr 38px; align-items: center; margin: 10px 0; gap: 6px; }
  #panel label span:first-child { color: #444; }
  #panel input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #panel input[type=color], #panel select, #panel input[type=checkbox] { justify-self: end; grid-column: 2 / 4; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; overflow: auto; padding: 32px; }
  #stage svg { display: block; margin: auto; flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  #panel input[type=number] { width: 58px; box-sizing: border-box; font: inherit; }
  #viewbox { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
             background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #viewbox span { color: #444; }
  #viewbox select { font: inherit; padding: 3px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: #3b82f6; color: #fff; text-decoration: none; cursor: pointer; }
  .btns select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 6px; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="mobile.css">
<body>
<div id="panel">
  <h1>Imprint</h1>
  <div id="controls"></div>
  <div class="btns">
    <select id="fmt" title="file type"></select>
    <a id="dl">⬇ export</a>
    <a id="dldir" title="choose export folder">📁 …</a>
  </div>
</div>
<div id="stage"></div>
<div id="viewbox">
  <span>view</span>
  <select id="zoom">
    <option value="fit">scale to fit</option>
    <option>10%</option><option>25%</option><option>50%</option><option>75%</option>
    <option>100%</option><option>150%</option><option>200%</option>
  </select>
</div>
<script src="export.js"></script>
<script src="zoom.js"></script>
<script src="mobile.js"></script>
<script src="sliders.js"></script>
<script>
// ---------- parameters ----------
const DEFS = [
  ["seed",    "range", {min: 1, max: 9999, step: 1, value: 42}],
  ["rays",    "range", {min: 3, max: 40, step: 1, value: 14}],
  ["length",  "range", {min: 20, max: 100, step: 1, value: 78, label: "reach %"}],
  ["vary",    "range", {min: 0, max: 90, step: 5, value: 45, label: "length vary %"}],
  ["scatter", "range", {min: 0, max: 100, step: 5, value: 60, label: "scatter %"}],
  ["pairs",   "range", {min: 0, max: 100, step: 5, value: 45, label: "pairs %"}],
  ["stroke",  "range", {min: 0.5, max: 12, step: 0.5, value: 3, label: "stroke px"}],
  ["relief",  "select", {options: ["raised", "pressed"], value: "raised"}],
  ["depth",   "range", {min: 0, max: 8, step: 0.5, value: 2, label: "depth px"}],
  ["soften",  "range", {min: 0, max: 6, step: 0.25, value: 1, label: "soften px"}],
  ["light",   "range", {min: 0, max: 360, step: 5, value: 225, label: "light angle"}],
  ["shadow",  "color", {value: "#000000", label: "shadow"}],
  ["shadowO", "range", {min: 0, max: 100, step: 5, value: 20, label: "shadow %"}],
  ["glow",    "color", {value: "#ffffff", label: "highlight"}],
  ["glowO",   "range", {min: 0, max: 100, step: 5, value: 55, label: "highlight %"}],
  ["halo",    "range", {min: 0, max: 100, step: 5, value: 35, label: "halo %"}],
  ["paper",   "color", {value: "#e9e7e3", label: "paper"}],
  ["line",    "color", {value: "#f1efeb", label: "line"}],
  ["motion",  "select", {options: ["none", "drift", "grow in", "grow loop"], value: "drift"}],
  ["drift",   "range", {min: 0, max: 100, step: 5, value: 40, label: "drift %"}],
  ["speed",   "range", {min: 0.5, max: 20, step: 0.5, value: 6, label: "cycle sec"}],
  ["stagger", "range", {min: 0, max: 100, step: 5, value: 60, label: "stagger %"}]
];
const p = {};
const saved = JSON.parse(localStorage.getItem("imprint") || "{}");
const controls = document.getElementById("controls");

// ---------- artboard size (exact pixels) ----------
p.wpx = +saved.wpx || 1500;
p.hpx = +saved.hpx || 1500;
{
  const wIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.wpx});
  const hIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.hpx});
  const preset = document.createElement("select");
  for (const o of ["custom", "1:1", "2:3", "3:4", "4:5", "9:16"]) preset.append(new Option(o, o));
  const swap = Object.assign(document.createElement("button"), {textContent: "⇄", title: "swap width/height"});
  swap.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  p.lock = saved.lock ?? false;
  const lock = Object.assign(document.createElement("button"), {title: "lock aspect ratio"});
  lock.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  const drawLock = () => { lock.textContent = p.lock ? "🔒" : "🔓"; lock.style.background = p.lock ? "#eef" : "#fff"; };
  drawLock();
  lock.addEventListener("click", () => { p.lock = !p.lock; drawLock(); localStorage.setItem("imprint", JSON.stringify(p)); });

  const sizeRow = document.createElement("label");
  sizeRow.style.cssText = "display:flex;justify-content:space-between;align-items:center";
  sizeRow.innerHTML = "<span>artboard px</span>";
  const sizeBox = document.createElement("span");
  sizeBox.style.cssText = "display:flex;align-items:center;gap:4px";
  sizeBox.append(wIn, "×", hIn, lock);
  sizeRow.append(sizeBox);

  const presetRow = document.createElement("label");
  presetRow.innerHTML = "<span>aspect</span>";
  const presetBox = document.createElement("span");
  presetBox.style.cssText = "display:flex;align-items:center;gap:6px;grid-column:2/4;justify-self:end";
  presetBox.append(preset, swap);
  presetRow.append(presetBox);

  let ratio = p.hpx / p.wpx;                     // locked aspect, frozen at lock time
  lock.addEventListener("click", () => { if (p.lock) ratio = p.hpx / p.wpx; });
  const apply = soft => {
    p.wpx = Math.max(100, Math.min(8000, +wIn.value || p.wpx));
    p.hpx = Math.max(100, Math.min(8000, +hIn.value || p.hpx));
    if (!soft) { wIn.value = p.wpx; hIn.value = p.hpx; ratio = p.hpx / p.wpx; }
    render();                                    // render() persists — saves on every keystroke
  };
  const onEdit = (src, other, factor) => soft => {
    if (p.lock) other.value = Math.round((+src.value || 100) * factor());
    else preset.value = "custom";
    apply(soft);
  };
  const wEdit = onEdit(wIn, hIn, () => ratio), hEdit = onEdit(hIn, wIn, () => 1 / ratio);
  wIn.addEventListener("input", () => wEdit(true));    // live: saves while typing, no clamp-fight
  wIn.addEventListener("change", () => wEdit(false));  // commit: normalize the field
  hIn.addEventListener("input", () => hEdit(true));
  hIn.addEventListener("change", () => hEdit(false));
  preset.addEventListener("input", () => {
    if (preset.value === "custom") return;
    const [a, b] = preset.value.split(":").map(Number);
    hIn.value = Math.round(p.wpx * b / a);   // width is the anchor
    apply();
  });
  swap.addEventListener("click", () => {
    [wIn.value, hIn.value] = [hIn.value, wIn.value];
    preset.value = "custom";
    apply();
  });
  controls.append(sizeRow, presetRow);
}

for (const [key, type, opt] of DEFS) {
  p[key] = key in saved ? saved[key] : opt.value;
  if (type === "select" && !opt.options.includes(p[key])) p[key] = opt.value;  // stale saved value
  const label = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = opt.label || key;
  label.append(name);
  let input;
  if (type === "select") {
    input = document.createElement("select");
    for (const o of opt.options) input.append(new Option(o, o, o === p[key], o === p[key]));
  } else {
    input = document.createElement("input");
    input.type = type;
    if (type === "range") { Object.assign(input, {min: opt.min, max: opt.max, step: opt.step}); input.dataset.def = opt.value; }
    input.value = p[key];
  }
  label.append(input);
  let out;
  if (type === "range") { out = document.createElement("output"); out.value = p[key]; label.append(out); }
  input.addEventListener("input", () => {
    p[key] = type === "range" ? +input.value : input.value;
    if (out) out.value = input.value;
    render();
  });
  controls.append(label);
}

// ---------- generator ----------
function makeSVG() {
  const W = p.wpx, H = p.hpx;
  const mulberry = s => () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rnd = mulberry(p.seed), rnd2 = mulberry(p.seed * 31 + 7);
  const f = n => +n.toFixed(2);
  const R = Math.min(W, H) / 2, cx = W / 2, cy = H / 2;

  // emboss: two opposing drop shadows; the dark one falls away from the light.
  // Shadow and highlight each carry their own color + opacity, so the relief
  // stays legible on any paper/line combination (tinted shadow, colored glow …).
  const th = p.light * Math.PI / 180;
  const dxL = f(Math.cos(th) * p.depth), dyL = f(Math.sin(th) * p.depth);   // toward light
  const rai = p.relief === "raised" ? 1 : -1;
  const defs = `<defs>`
    + `<filter id="emb" x="-50%" y="-50%" width="200%" height="200%">`
    + `<feDropShadow dx="${f(-dxL * rai)}" dy="${f(-dyL * rai)}" stdDeviation="${f(p.soften)}" flood-color="${p.shadow}" flood-opacity="${f(p.shadowO / 100)}"/>`
    + `<feDropShadow dx="${f(dxL * rai)}" dy="${f(dyL * rai)}" stdDeviation="${f(p.soften)}" flood-color="${p.glow}" flood-opacity="${f(p.glowO / 100)}"/>`
    + `</filter>`
    + `<filter id="soft" x="-100%" y="-100%" width="300%" height="300%">`
    + `<feGaussianBlur stdDeviation="${f(R * 0.02)}"/></filter></defs>`;

  // rays: even fan, scattered; pairs = shorter near-parallel companion strokes
  const rays = [];
  for (let i = 0; i < p.rays; i++) {
    const a = (i / p.rays) * 2 * Math.PI + (rnd() - 0.5) * 2 * Math.PI * (p.scatter / 100);
    const len = R * (p.length / 100) * (1 - rnd() * p.vary / 100);
    const r0 = R * 0.02 * rnd();
    const w = p.stroke * (0.6 + rnd() * 0.8);
    rays.push({a, r0, len, w, off: 0, main: true});
    if (rnd() < p.pairs / 100)
      rays.push({a: a + (rnd() - 0.5) * 0.06, r0: r0 + len * 0.15 * rnd(),
                 len: len * (0.5 + rnd() * 0.45), w: w * 0.8, off: (rnd() - 0.5) * p.stroke * 6});
  }

  const halos = [], strokes = [];
  const loop = p.motion === "grow loop", growing = loop || p.motion === "grow in";
  const dur = f(p.speed);
  const amp = R * 0.12 * (p.drift / 100);
  // drift: one scalar attribute wanders through two waypoints and returns —
  // start = end, so the loop is seamless at any stagger offset
  const wob = (attr, base, a) => `<animate attributeName="${attr}"`
    + ` values="${f(base)};${f(base + (rnd2() * 2 - 1) * a)};${f(base + (rnd2() * 2 - 1) * a)};${f(base)}"`
    + ` keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"`
    + ` dur="${dur}s" begin="${f(-rnd2() * p.speed * (p.stagger / 100))}s" repeatCount="indefinite"/>`;
  for (const r of rays) {
    const ux = Math.cos(r.a), uy = Math.sin(r.a);
    const x1 = f(cx + ux * r.r0 - uy * r.off), y1 = f(cy + uy * r.r0 + ux * r.off);
    const x2 = f(cx + ux * r.len - uy * r.off), y2 = f(cy + uy * r.len + ux * r.off);
    const L = f(Math.hypot(x2 - x1, y2 - y1));
    let anim = "", dash = "";
    if (growing) {
      // grow: dashoffset slides from full length to 0 — the ray draws outward
      anim = `<animate attributeName="stroke-dashoffset" values="${L};0;0" keyTimes="0;0.6;1"`
        + ` calcMode="spline" keySplines=".16 1 .3 1;0 0 1 1" dur="${dur}s"`
        + ` begin="${f(rnd2() * p.speed * (p.stagger / 100) * (loop ? -1 : 1))}s"`
        + (loop ? ` repeatCount="indefinite"` : ` fill="freeze"`) + `/>`;
      dash = ` stroke-dasharray="${L}" stroke-dashoffset="${L}"`;
    } else if (p.motion === "drift" && amp) {
      anim = wob("x2", x2, amp) + wob("y2", y2, amp);   // tips wander
    }
    if (r.main && p.halo)
      halos.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${p.glow}"`
        + ` stroke-width="${f(r.w * 12)}" opacity="${f(p.halo / 100 * 0.14)}">`
        + (growing ? "" : anim) + `</line>`);   // halo tips follow the stroke's drift
    strokes.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${p.line}"`
      + ` stroke-width="${f(r.w)}"${dash}>${anim}</line>`);
  }

  // drift: the whole burst's origin wanders too, on a slower unsynced loop
  const ctr = () => `${f((rnd2() * 2 - 1) * amp * 0.6)} ${f((rnd2() * 2 - 1) * amp * 0.6)}`;
  const centerAnim = p.motion === "drift" && amp
    ? `<animateTransform attributeName="transform" type="translate"`
      + ` values="0 0;${ctr()};${ctr()};0 0" keyTimes="0;0.33;0.66;1"`
      + ` calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"`
      + ` dur="${f(p.speed * 1.7)}s" repeatCount="indefinite"/>`
    : "";
  // filters live on the two groups, not on the lines — while drifting, the
  // browser re-renders every filter surface every frame, so this is 2 passes
  // instead of one per line/halo (the difference between smooth and lag)
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
    + defs + `<rect width="${W}" height="${H}" fill="${p.paper}"/>`
    + `<g>${centerAnim}<g filter="url(#soft)">${halos.join("")}</g>`
    + `<g filter="url(#emb)">${strokes.join("")}</g></g></svg>`;
  return {w: W, h: H, svg};
}

// ---------- render + export ----------
const stage = document.getElementById("stage");
const zoomEl = document.getElementById("zoom");
p.zoom = saved.zoom === "fit" || typeof saved.zoom === "number" ? saved.zoom : "fit";
let art;
const view = createZoom({
  stage, select: zoomEl, zoom: p.zoom,
  size: () => ({w: art.w, h: art.h}),
  onChange: z => { p.zoom = z; localStorage.setItem("imprint", JSON.stringify(p)); },
});
function render() {
  localStorage.setItem("imprint", JSON.stringify(p));
  art = makeSVG();
  stage.innerHTML = art.svg;
  view.apply();
}
wireExport({
  SVG: () => saveAs(`imprint-${p.seed}.svg`, svgBlob(art.svg)),
  PNG: async () => saveAs(`imprint-${p.seed}.png`, await svgToPNG(art.svg, art.w, art.h)),
});
render();

// self-check: deterministic output for fixed params
console.assert(makeSVG().svg === makeSVG().svg, "generator must be deterministic");
</script>
</body>
</html>
