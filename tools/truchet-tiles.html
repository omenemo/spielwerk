<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Truchet Tiles — parametric generator</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; display: flex; background: #e9e7e2; }
  #panel { width: 264px; margin: 16px; padding: 14px 18px; background: #fff; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; flex-shrink: 0;
           align-self: flex-start; max-height: calc(100vh - 32px); overflow-y: auto; }
  #panel label { display: grid; grid-template-columns: 90px 1fr 38px; align-items: center; margin: 10px 0; gap: 6px; }
  #panel label span:first-child { color: #444; }
  #panel input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #panel input[type=color], #panel select, #panel input[type=checkbox] { justify-self: end; grid-column: 2 / 4; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; overflow: auto; padding: 32px; }
  #stage svg { display: block; margin: auto; flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  #panel input[type=number] { width: 58px; box-sizing: border-box; font: inherit; }
  #viewbox { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
             background: #fff; border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #viewbox span { color: #444; }
  #viewbox select { font: inherit; padding: 3px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: #3b82f6; color: #fff; text-decoration: none; cursor: pointer; }
  h1 { font-size: 14px; margin: 0 0 6px; }
</style>
<body>
<div id="panel">
  <h1>Truchet Tiles</h1>
  <div id="controls"></div>
  <div class="btns"><a id="dlsvg">⬇ SVG</a><a id="dlpng">⬇ PNG</a><a id="dldir" title="choose export folder">📁 …</a></div>
</div>
<div id="stage"></div>
<div id="viewbox">
  <span>view</span>
  <select id="zoom">
    <option value="fit">scale to fit</option>
    <option>10%</option><option>25%</option><option>50%</option><option>75%</option>
    <option>100%</option><option>150%</option><option>200%</option>
  </select>
</div>
<script src="export.js"></script>
<script>
// ---------- parameters ----------
const DEFS = [
  ["seed",   "range", {min: 1, max: 9999, step: 1, value: 42}],
  ["cols",   "range", {min: 2, max: 40, step: 1, value: 8, label: "tiles across"}],
  ["style",  "select", {options: ["arcs", "triangles", "10 PRINT", "mix"], value: "arcs"}],
  ["lines",  "range", {min: 1, max: 5, step: 1, value: 1, label: "arcs / corner"}],
  ["stroke", "range", {min: 5, max: 95, step: 1, value: 40, label: "stroke %"}],
  ["bias",   "range", {min: 0, max: 100, step: 5, value: 50, label: "turn bias %"}],
  ["ink",    "color", {value: "#1c1c1c", label: "ink"}],
  ["ink2",   "color", {value: "#e84f5e", label: "second ink"}],
  ["duo",    "range", {min: 0, max: 100, step: 5, value: 0, label: "second ink %"}],
  ["paper",  "color", {value: "#f4f1ea", label: "paper"}]
];
const p = {};
const saved = JSON.parse(localStorage.getItem("truchet-tiles") || "{}");
const controls = document.getElementById("controls");

// ---------- artboard size (exact pixels) ----------
p.wpx = +saved.wpx || 1500;
p.hpx = +saved.hpx || 2000;
{
  const wIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.wpx});
  const hIn = Object.assign(document.createElement("input"), {type: "number", min: 100, max: 8000, value: p.hpx});
  const preset = document.createElement("select");
  for (const o of ["custom", "2:3", "3:4", "4:5", "1:1", "9:16"]) preset.append(new Option(o, o));
  const swap = Object.assign(document.createElement("button"), {textContent: "⇄", title: "swap width/height"});
  swap.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  p.lock = saved.lock ?? false;
  const lock = Object.assign(document.createElement("button"), {title: "lock aspect ratio"});
  lock.style.cssText = "font:inherit;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer";
  const drawLock = () => { lock.textContent = p.lock ? "🔒" : "🔓"; lock.style.background = p.lock ? "#eef" : "#fff"; };
  drawLock();
  lock.addEventListener("click", () => { p.lock = !p.lock; drawLock(); localStorage.setItem("truchet-tiles", JSON.stringify(p)); });

  const sizeRow = document.createElement("label");
  sizeRow.style.cssText = "display:flex;justify-content:space-between;align-items:center";
  sizeRow.innerHTML = "<span>artboard px</span>";
  const sizeBox = document.createElement("span");
  sizeBox.style.cssText = "display:flex;align-items:center;gap:4px";
  sizeBox.append(wIn, "×", hIn, lock);
  sizeRow.append(sizeBox);

  const presetRow = document.createElement("label");
  presetRow.innerHTML = "<span>aspect</span>";
  const presetBox = document.createElement("span");
  presetBox.style.cssText = "display:flex;align-items:center;gap:6px;grid-column:2/4;justify-self:end";
  presetBox.append(preset, swap);
  presetRow.append(presetBox);

  let ratio = p.hpx / p.wpx;                     // locked aspect, frozen at lock time
  lock.addEventListener("click", () => { if (p.lock) ratio = p.hpx / p.wpx; });
  const apply = soft => {
    p.wpx = Math.max(100, Math.min(8000, +wIn.value || p.wpx));
    p.hpx = Math.max(100, Math.min(8000, +hIn.value || p.hpx));
    if (!soft) { wIn.value = p.wpx; hIn.value = p.hpx; ratio = p.hpx / p.wpx; }
    render();                                    // render() persists — saves on every keystroke
  };
  const onEdit = (src, other, factor) => soft => {
    if (p.lock) other.value = Math.round((+src.value || 100) * factor());
    else preset.value = "custom";
    apply(soft);
  };
  const wEdit = onEdit(wIn, hIn, () => ratio), hEdit = onEdit(hIn, wIn, () => 1 / ratio);
  wIn.addEventListener("input", () => wEdit(true));    // live: saves while typing, no clamp-fight
  wIn.addEventListener("change", () => wEdit(false));  // commit: normalize the field
  hIn.addEventListener("input", () => hEdit(true));
  hIn.addEventListener("change", () => hEdit(false));
  preset.addEventListener("input", () => {
    if (preset.value === "custom") return;
    const [a, b] = preset.value.split(":").map(Number);
    hIn.value = Math.round(p.wpx * b / a);   // width is the anchor
    apply();
  });
  swap.addEventListener("click", () => {
    [wIn.value, hIn.value] = [hIn.value, wIn.value];
    preset.value = "custom";
    apply();
  });
  controls.append(sizeRow, presetRow);
}

for (const [key, type, opt] of DEFS) {
  p[key] = key in saved ? saved[key] : opt.value;
  const label = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = opt.label || key;
  label.append(name);
  let input;
  if (type === "select") {
    input = document.createElement("select");
    for (const o of opt.options) input.append(new Option(o, o, o === p[key], o === p[key]));
  } else {
    input = document.createElement("input");
    input.type = type;
    if (type === "range") Object.assign(input, {min: opt.min, max: opt.max, step: opt.step});
    input.value = p[key];
  }
  label.append(input);
  let out;
  if (type === "range") { out = document.createElement("output"); out.value = p[key]; label.append(out); }
  input.addEventListener("input", () => {
    p[key] = type === "range" ? +input.value : input.value;
    if (out) out.value = input.value;
    render();
  });
  controls.append(label);
}

// ---------- generator ----------
function makeSVG() {
  const W = p.wpx, H = p.hpx;
  const mulberry = s => () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rnd = mulberry(p.seed);
  const f = n => +n.toFixed(2);
  const s = W / p.cols;                          // square tile side
  const rows = Math.max(1, Math.round(H / s));
  const STYLES = ["arcs", "triangles", "10 PRINT"];
  const bias = p.bias / 100;

  // multi-arc radii, symmetric about s/2 so strands connect across any
  // neighbor orientation: r_i = s·i/(n+1)
  const radii = Array.from({length: p.lines}, (_, i) => s * (i + 1) / (p.lines + 1));
  const sw = f(Math.max(0.5, s / (p.lines + 1) * (p.stroke / 100)));

  // tile geometry at orientation 0, local coords (rotation handles the rest)
  const arcs = radii.map(r =>
    `M${f(r)} 0 A${f(r)} ${f(r)} 0 0 1 0 ${f(r)}` +
    `M${f(s - r)} ${f(s)} A${f(r)} ${f(r)} 0 0 1 ${f(s)} ${f(s - r)}`).join("");
  const tri = `M0 0 L${f(s)} 0 L0 ${f(s)} Z`;
  const diag = `M0 0 L${f(s)} ${f(s)}`;

  const parts = [`<rect width="${W}" height="${H}" fill="${p.paper}"/>`];
  for (let row = 0; row < rows; row++) for (let col = 0; col < p.cols; col++) {
    // fixed 4 draws per tile — the stream stays aligned whatever style is set
    const rStyle = rnd(), rTurn = rnd(), rTurn2 = rnd(), rDuo = rnd();
    const style = p.style === "mix" ? STYLES[(rStyle * 3) | 0] : p.style;
    const o = (rTurn < bias ? 0 : 1) + (style === "triangles" && rTurn2 < 0.5 ? 2 : 0);
    const color = rDuo < p.duo / 100 ? p.ink2 : p.ink;
    const rot = o ? ` rotate(${90 * o} ${f(s / 2)} ${f(s / 2)})` : "";
    const d = style === "arcs" ? arcs : style === "triangles" ? tri : diag;
    const paint = style === "triangles"
      ? `fill="${color}"`
      : `fill="none" stroke="${color}" stroke-width="${sw}"`;
    parts.push(`<path transform="translate(${f(col * s)} ${f(row * s)})${rot}" d="${d}" ${paint}/>`);
  }
  return {w: W, h: H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${parts.join("")}</svg>`};
}

// ---------- render + export ----------
const stage = document.getElementById("stage");
const zoomEl = document.getElementById("zoom");
p.zoom = saved.zoom === "fit" || typeof saved.zoom === "number" ? saved.zoom : "fit";  // "fit" | percent
let art;
const zPct = () => p.zoom === "fit"
  ? Math.min((stage.clientWidth - 64) / art.w, (stage.clientHeight - 64) / art.h, 1) * 100
  : p.zoom;
function syncSelect() {
  if (p.zoom === "fit") { zoomEl.value = "fit"; return; }
  const label = Math.round(p.zoom) + "%";
  let opt = [...zoomEl.options].find(o => o.value === label);
  if (!opt) {
    opt = zoomEl.querySelector(".custom") || zoomEl.appendChild(Object.assign(new Option(), {className: "custom"}));
    opt.textContent = opt.value = label;
  }
  zoomEl.value = label;
}
function applyZoom() {
  const svg = stage.querySelector("svg");
  if (!svg) return;
  const z = zPct() / 100;
  svg.style.width = art.w * z + "px";
  svg.style.height = art.h * z + "px";   // both set — box always matches viewBox, no letterbox
  syncSelect();
}
function setZoom(v, ax, ay) {            // v: "fit" | percent; ax/ay: stage-relative anchor
  const oldZ = zPct() / 100;
  p.zoom = v === "fit" ? "fit" : Math.max(2, Math.min(800, v));
  localStorage.setItem("truchet-tiles", JSON.stringify(p));
  const r = stage.getBoundingClientRect();
  ax ??= r.width / 2; ay ??= r.height / 2;
  const cx = stage.scrollLeft + ax, cy = stage.scrollTop + ay;
  applyZoom();
  const k = (zPct() / 100) / oldZ;       // keep the anchor point stationary
  stage.scrollLeft = cx * k - ax;
  stage.scrollTop = cy * k - ay;
}
zoomEl.addEventListener("input", () => setZoom(zoomEl.value === "fit" ? "fit" : parseFloat(zoomEl.value)));
addEventListener("resize", () => { if (p.zoom === "fit") applyZoom(); });

// ---------- adobe-style navigation ----------
let space = false;
const typing = e => /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.code === "Space" && !typing(e)) { space = true; stage.style.cursor = "grab"; e.preventDefault(); }
  else if (mod && (e.key === "+" || e.key === "=")) { e.preventDefault(); setZoom(zPct() * 1.25); }
  else if (mod && e.key === "-") { e.preventDefault(); setZoom(zPct() / 1.25); }
  else if (mod && e.key === "0") { e.preventDefault(); setZoom("fit"); }
  else if (mod && e.key === "1") { e.preventDefault(); setZoom(100); }
});
addEventListener("keyup", e => { if (e.code === "Space") { space = false; stage.style.cursor = ""; } });
stage.addEventListener("pointerdown", e => {          // space + drag = pan
  if (!space) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, sl = stage.scrollLeft, st = stage.scrollTop;
  stage.style.cursor = "grabbing";
  const move = ev => { stage.scrollLeft = sl - (ev.clientX - sx); stage.scrollTop = st - (ev.clientY - sy); };
  stage.setPointerCapture(e.pointerId);
  stage.addEventListener("pointermove", move);
  stage.addEventListener("pointerup", () => { stage.removeEventListener("pointermove", move); stage.style.cursor = "grab"; }, {once: true});
});
stage.addEventListener("wheel", e => {                // ⌘/ctrl/alt + wheel (or pinch) = zoom to cursor
  if (!(e.ctrlKey || e.metaKey || e.altKey)) return;  // plain wheel/trackpad = scroll
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  setZoom(zPct() * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
}, {passive: false});
function render() {
  localStorage.setItem("truchet-tiles", JSON.stringify(p));
  art = makeSVG();
  stage.innerHTML = art.svg;
  applyZoom();
}
document.getElementById("dlsvg").addEventListener("click", () =>
  saveAs(`truchet-${p.seed}.svg`, new Blob([art.svg], {type: "image/svg+xml"})));
document.getElementById("dldir").addEventListener("click", async e => {
  const a = e.currentTarget;
  try {
    await pickExportDir();
    a.textContent = "📁 " + (exportDirName() || "…");
    a.title = exportDirName() ? `exporting to ${exportDirName()}` : "choose export folder";
  } catch (err) {
    a.textContent = "📁 ✗";
    a.title = err.message;      // hover the button to see why
    console.warn("export folder:", err);
  }
});
document.getElementById("dlpng").addEventListener("click", async () => {
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([art.svg], {type: "image/svg+xml"}));
  await img.decode();
  const c = document.createElement("canvas");
  c.width = art.w; c.height = art.h;   // export = exact artboard pixels
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  c.toBlob(b => saveAs(`truchet-${p.seed}.png`, b), "image/png");
});
render();

// self-check: deterministic output for fixed params
console.assert(makeSVG().svg === makeSVG().svg, "generator must be deterministic");
</script>
</body>
</html>
